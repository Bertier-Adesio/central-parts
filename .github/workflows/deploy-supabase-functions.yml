# Redéploie les fonctions Edge Supabase touchées par chaque push sur main (ADR 0016).
# Une PR fournisseurs ne redéploie que depot, import-stock ou wechat-events ; une PR clients, search ou order ;
# une modification de supabase/functions/_shared/ redéploie les fonctions qui l'importent.
# Les migrations ne sont jamais appliquées ici : elles restent manuelles, dans l'ordre, dans le SQL Editor.
# Secret à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   SUPABASE_ACCESS_TOKEN  jeton d'accès personnel Supabase (Account > Access Tokens)
# Variable facultative (même écran, onglet Variables) :
#   SUPABASE_PROJECT_REF   projet cible ; par défaut, la production (tuhbzziqyisdnqzfvtkh)
name: Déploiement fonctions (Supabase)

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "tools/deploy-functions.sh", ".github/workflows/deploy-supabase-functions.yml"]
  workflow_dispatch:
    inputs:
      functions:
        description: "Fonctions à déployer, séparées par des espaces (vide : toutes)"
        required: false
        default: ""

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Déploie les fonctions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          BEFORE: ${{ github.event.before }}
          INPUT: ${{ github.event.inputs.functions }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Secret SUPABASE_ACCESS_TOKEN absent : rien n'est déployé." >&2; exit 1; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tools/deploy-functions.sh $INPUT
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            tools/deploy-functions.sh
          else
            tools/deploy-functions.sh --changed "$BEFORE"
          fi
