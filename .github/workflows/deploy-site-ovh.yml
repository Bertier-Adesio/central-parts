# Publie site/ sur l'hébergement web OVH associé à central.parts, en SFTP.
# Le serveur FTP d'OVH n'accepte pas le FTPS (« 500 This security scheme is
# not implemented ») : on passe par SSH, qui chiffre identifiants et fichiers.
# Prérequis : SSH activé pour l'utilisateur principal (Hébergements > centryv > FTP-SSH).
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   OVH_FTP_USER      identifiant FTP-SSH principal de l'hébergement (ex. centryv)
#   OVH_FTP_PASSWORD  mot de passe de cet identifiant
name: Déploiement site (OVH)

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy-site-ovh.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installe lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoi SFTP vers www/
        env:
          OVH_HOST: ssh.cluster129.hosting.ovh.net
          OVH_FTP_USER: ${{ secrets.OVH_FTP_USER }}
          # lftp lit le mot de passe dans LFTP_PASSWORD (option --env-password) :
          # il n'apparaît ni dans la ligne de commande ni dans les logs.
          LFTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          lftp -c "
            set cmd:fail-exit yes;
            set net:max-retries 2;
            set net:timeout 20;
            set sftp:auto-confirm yes;
            open --env-password -u \"$OVH_FTP_USER\" sftp://$OVH_HOST;
            mirror --reverse --verbose --parallel=4 \
              --exclude-glob .git* --exclude-glob README.md \
              ./site/ www/
          "

      # Le mirror ne supprime rien sur le serveur. On retire donc ici, par une
      # liste explicite, ce qui ne doit plus être publié : fichiers du design
      # system envoyés à la main avant le premier déploiement, et runtime de la
      # maquette retiré du dépôt (ADR 0002). Un élément absent n'est pas une erreur.
      - name: Nettoie www/
        env:
          OVH_HOST: ssh.cluster129.hosting.ovh.net
          OVH_FTP_USER: ${{ secrets.OVH_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          lftp -c "
            set cmd:fail-exit yes;
            set net:max-retries 2;
            set net:timeout 20;
            set sftp:auto-confirm yes;
            open --env-password -u \"$OVH_FTP_USER\" sftp://$OVH_HOST;
            cd www;
            # Seulement une fois dans www/ : les suppressions manquantes sont tolérées.
            set cmd:fail-exit no;
            rm -r ui_kits;
            rm -r components;
            rm -r tokens;
            rm -r guidelines;
            rm -r assets/js;
            rm -r assets/vendor;
            glob -a rm -f *.dc.html;
            rm -f support.js;
            rm -f SKILL.md;
            echo Nettoyage terminé.
          "
