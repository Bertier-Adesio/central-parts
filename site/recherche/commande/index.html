<!DOCTYPE html>
<!-- Suivi d'une demande d'achat (ADR 0014) : FR, EN, 中文. Écrite à la main, pas générée.
     Elle appelle la fonction Edge Supabase « order » avec la référence et le jeton du lien reçu à la création. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi de la demande — Central.Parts</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/tokens.css">
<style>
body{margin:0;background:var(--bg-page);color:var(--fg-1);font-family:var(--font-sans),var(--font-cjk),system-ui,sans-serif;line-height:var(--leading-body)}
.hdr{background:var(--bg-inverse);color:var(--fg-inverse)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{display:flex;align-items:center;gap:10px;color:var(--fg-inverse);text-decoration:none;font-weight:var(--weight-medium)}
.brand .accent,.dot{color:var(--accent);fill:var(--accent)}
.lang{background:none;border:1px solid var(--fg-inverse-2);color:var(--fg-inverse);border-radius:var(--radius-sm);padding:4px 10px;font:inherit;font-size:var(--text-sm);cursor:pointer}
main.wrap{padding:32px 16px 64px}
h1{font-size:var(--text-2xl);line-height:var(--leading-tight);margin:0 0 8px}
.lead{color:var(--fg-2);margin:0 0 24px}
.card{background:var(--bg-surface);border:1px solid var(--border-1);border-radius:var(--radius-md);padding:20px;margin:0 0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:var(--control-h-lg);padding:0 20px;border-radius:var(--radius-sm);border:1px solid transparent;font:inherit;font-weight:var(--weight-medium);cursor:pointer;text-decoration:none}
.btn-main{background:var(--bg-inverse);color:var(--fg-inverse)}
.btn[disabled]{opacity:.5;cursor:default}
.muted{color:var(--fg-3);font-size:var(--text-sm)}
.msg{padding:12px 14px;border-radius:var(--radius-sm);margin:0 0 16px;font-size:var(--text-sm)}
.msg.err{background:var(--status-danger-bg);color:var(--status-danger)}
.msg.ok{background:var(--status-success-bg);color:var(--status-success)}
.msg.info{background:var(--status-info-bg);color:var(--status-info)}
.btn-line{background:var(--bg-surface);color:var(--fg-1);border-color:var(--border-2)}
h2{font-size:var(--text-lg);margin:0 0 8px}
[hidden]{display:none!important}
form.search{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
form.search input,form.search select{min-height:var(--control-h-lg);padding:0 12px;border:1px solid var(--border-2);border-radius:var(--radius-sm);background:var(--bg-surface);color:var(--fg-1);font:inherit;box-sizing:border-box}
form.search input{flex:1 1 220px;min-width:0;font-family:var(--font-mono);text-transform:uppercase}
.res{border-top:1px solid var(--border-1);padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.res:first-child{border-top:0}
.steps{list-style:none;padding:0;margin:12px 0 0}
.steps li{padding:6px 0 6px 28px;position:relative;font-size:var(--text-sm);color:var(--fg-3)}
.steps li::before{content:'';position:absolute;left:6px;top:11px;width:10px;height:10px;border-radius:50%;border:2px solid var(--border-2)}
.steps li.done{color:var(--fg-1)}
.steps li.done::before{background:var(--accent);border-color:var(--accent)}
.mpn{font-family:var(--font-mono);font-weight:var(--weight-semibold);overflow-wrap:anywhere}
.price{text-align:right;font-weight:var(--weight-semibold);white-space:nowrap}
.meta{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap;font-size:var(--text-sm);color:var(--fg-2)}
.tag{font-size:var(--text-xs);padding:2px 8px;border-radius:var(--radius-pill);background:var(--bg-sunken);color:var(--fg-2);white-space:nowrap}
.tag.opp{background:var(--status-warning-bg);color:var(--status-warning)}
.cta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.btn-line{background:var(--bg-surface);color:var(--fg-1);border-color:var(--border-2)}
.buy{grid-column:1 / -1;justify-self:start;min-height:var(--control-h-md);padding:0 14px}
form.order label{display:block;font-size:var(--text-sm);font-weight:var(--weight-medium);margin:0 0 12px}
form.order input,form.order select,form.order textarea{display:block;width:100%;box-sizing:border-box;min-height:var(--control-h-lg);margin:4px 0 0;padding:8px 12px;border:1px solid var(--border-2);border-radius:var(--radius-sm);background:var(--bg-surface);color:var(--fg-1);font:inherit}
form.order .two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:480px){form.order .two{grid-template-columns:1fr}}
form.order .check{display:flex;gap:8px;align-items:flex-start;font-weight:normal}
form.order .check input{width:auto;min-height:0;margin:3px 0 0}
.quote{font-family:var(--font-mono);background:var(--bg-sunken);border-radius:var(--radius-sm);padding:10px 12px;margin:0 0 12px;font-size:var(--text-sm)}
.quote:empty{display:none}
</style>
</head>
<body>

<header class="hdr">
  <div class="wrap">
    <a class="brand" href="/" id="home">
      <svg width="22" height="22" viewBox="24 24 432 432" aria-hidden="true"><path d="M370.50 99.17A192 192 0 1 0 370.50 380.83" fill="none" stroke="currentColor" stroke-width="48" stroke-linecap="round"/><path d="M302.28 156.72A104 104 0 1 0 302.28 323.28" fill="none" stroke="currentColor" stroke-width="48" stroke-linecap="round"/><circle cx="240" cy="240" r="40" class="dot"/></svg>
      <span>Central<span class="accent">.</span>Parts</span>
    </a>
    <button class="lang" type="button" id="lang">EN</button>
  </div>
</header>

<main class="wrap">
  <h1 data-t="title">Suivi de la demande</h1>
  <noscript><p class="msg err">Le suivi nécessite JavaScript. · Tracking requires JavaScript. · 跟踪需要启用 JavaScript。</p></noscript>
  <div id="msg" class="msg" hidden role="status"></div>
  <section class="card" id="out" hidden>
    <p class="muted" id="ref"></p>
    <p class="mpn" id="mpn"></p>
    <p id="price"></p>
    <ol class="steps" id="steps"></ol>
  </section>
  <p><a href="/recherche/" data-t="back">Nouvelle recherche</a></p>
</main>

<script>
(function () {
  'use strict';
  var FN = 'https://tuhbzziqyisdnqzfvtkh.supabase.co/functions/v1/order/status';
  var STEPS = ['submitted', 'confirmed', 'proforma_sent', 'paid', 'shipped'];
  var T = {
    fr: { title: 'Suivi de la demande', back: 'Nouvelle recherche', ref: 'Demande {ref} du {date}', total: 'Total', unit: 'prix unitaire', toConfirm: 'Prix confirmé avec la proforma', excl: "hors droits et TVA à l'import",
      s: { submitted: 'Demande reçue', confirmed: 'Disponibilité confirmée par le fournisseur', proforma_sent: 'Facture proforma envoyée par e-mail', paid: 'Virement reçu', shipped: 'Expédiée' },
      end: { unavailable: "Le fournisseur n'a plus cette quantité : Central.Parts vous propose une alternative par e-mail.", cancelled: 'Demande annulée.' },
      e: { not_found: 'Demande introuvable : vérifiez le lien reçu.', network: 'Erreur réseau, réessayez.', other: 'Suivi indisponible, réessayez plus tard.' } },
    en: { title: 'Request tracking', back: 'New search', ref: 'Request {ref} of {date}', total: 'Total', unit: 'unit price', toConfirm: 'Price confirmed with the proforma', excl: 'excluding import duties and VAT',
      s: { submitted: 'Request received', confirmed: 'Availability confirmed by the supplier', proforma_sent: 'Proforma invoice sent by e-mail', paid: 'Bank transfer received', shipped: 'Shipped' },
      end: { unavailable: 'The supplier no longer has this quantity: Central.Parts will offer an alternative by e-mail.', cancelled: 'Request cancelled.' },
      e: { not_found: 'Request not found: please check the link you received.', network: 'Network error, please try again.', other: 'Tracking is unavailable, please try again later.' } },
    zh: { title: '采购申请跟踪', back: '重新搜索', ref: '申请 {ref}（{date}）', total: '合计', unit: '单价', toConfirm: '价格以形式发票为准', excl: '不含进口关税和增值税',
      s: { submitted: '已收到申请', confirmed: '供应商已确认库存', proforma_sent: '形式发票已通过邮件发送', paid: '已收到转账', shipped: '已发货' },
      end: { unavailable: '供应商已无此数量：Central.Parts 将通过邮件为您推荐替代货源。', cancelled: '申请已取消。' },
      e: { not_found: '未找到申请，请核对链接。', network: '网络错误，请重试。', other: '暂时无法查询，请稍后再试。' } }
  };
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  var lang = T[q.get('lang')] ? q.get('lang') : (/^zh/i.test(navigator.language) ? 'zh' : /^fr/i.test(navigator.language) ? 'fr' : 'en');
  var ORDER = ['fr', 'en', 'zh'], LABEL = { fr: 'FR', en: 'EN', zh: '中文' }, last = null;
  var t = function () { return T[lang]; };
  function money(v, cur) {
    try { return new Intl.NumberFormat(lang === 'zh' ? 'zh-CN' : lang === 'fr' ? 'fr-FR' : 'en-GB', { style: 'currency', currency: cur === 'CNH' ? 'CNY' : cur }).format(v); }
    catch (e) { return v + ' ' + cur; }
  }
  function say(text) { $('msg').hidden = !text; $('msg').className = 'msg err'; $('msg').textContent = text || ''; }
  function render(d) {
    $('out').hidden = false;
    $('ref').textContent = t().ref.replace('{ref}', d.ref).replace('{date}', new Date(d.created_at).toLocaleDateString(lang === 'zh' ? 'zh-CN' : lang === 'fr' ? 'fr-FR' : 'en-GB'));
    $('mpn').textContent = d.mpn + ' × ' + d.qty;
    $('price').textContent = d.unit_price == null ? t().toConfirm : t().total + ' ' + money(d.total, d.currency) + ' (' + t().unit + ' ' + money(d.unit_price, d.currency) + ', ' + t().excl + ')';
    var at = STEPS.indexOf(d.status), html = '';
    if (at < 0) html = '<li class="done">' + t().s.submitted + '</li><li class="done">' + (t().end[d.status] || d.status) + '</li>';
    else html = STEPS.map(function (s, i) { return '<li class="' + (i <= at ? 'done' : '') + '">' + t().s[s] + '</li>'; }).join('');
    $('steps').innerHTML = html;
  }
  function applyLang() {
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
    $('lang').textContent = LABEL[ORDER[(ORDER.indexOf(lang) + 1) % 3]];
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t()[el.getAttribute('data-t')]; });
    $('home').href = lang === 'fr' ? '/' : '/' + lang + '/';
    if (last) render(last);
  }
  $('lang').addEventListener('click', function () { lang = ORDER[(ORDER.indexOf(lang) + 1) % 3]; applyLang(); });
  applyLang();
  fetch(FN + '?ref=' + encodeURIComponent(q.get('ref') || '') + '&k=' + encodeURIComponent(q.get('k') || ''))
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) throw d.error || 'other'; return d; }); }, function () { throw 'network'; })
    .then(function (d) { last = d; render(d); }, function (c) { say(t().e[c] || t().e.other); });
})();
</script>
</body>
</html>
